name: "Terraform Monitoring Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/monitoring-global/**"
      - ".github/workflows/terraform-monitoring.yml"

jobs:
  terraform:
    name: "Deploy Monitoring Stack"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/monitoring-global

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=../backend/monitoring.tfbackend

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

