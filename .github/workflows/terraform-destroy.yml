name: Terraform EC2 Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: "Select environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # For AWS OIDC authentication
      contents: read

    defaults:
      run:
        working-directory: terraform   # <── ROOT LEVEL "terraform" FOLDER

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------
      # AWS OIDC Authentication
      # ---------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::108471662249:role/GhaDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------
      # Terraform Setup
      # ---------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # ---------------------------
      # Determine selected ENV
      # ---------------------------
      - name: Determine Environment
        id: env_select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ github.event.inputs.env }}" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      # Terraform INIT with backend
      # ---------------------------
      - name: Terraform Init
        run: terraform init -backend-config=backend/${{ steps.env_select.outputs.env }}.tfbackend

      - name: Terraform Validate
        run: terraform validate

      # ---------------------------
      # Terraform PLAN
      # ---------------------------
      - name: Terraform Plan
        run: terraform plan \
             -var-file=envs/${{ steps.env_select.outputs.env }}.tfvars \
             -out=tfplan

      # ---------------------------
      # Terraform APPLY
      # PROD requires workflow_dispatch ONLY
      # ---------------------------
      - name: Terraform Apply
        if: >
          steps.env_select.outputs.env != 'prod'
          || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

      # ---------------------------
      # OUTPUT summary (EC2 IP)
      # ---------------------------
      - name: Publish EC2 Output
        id: ec2out
        run: |
          IP=$(terraform output -json | jq -r '.public_ip.value // empty')
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env_select.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Public IP:** $IP" >> $GITHUB_STEP_SUMMARY
          if [ ! -z "$IP" ]; then
            echo "[Open Website](http://$IP)" >> $GITHUB_STEP_SUMMARY
          fi
