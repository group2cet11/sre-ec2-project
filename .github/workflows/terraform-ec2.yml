name: Terraform EC2 Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT REPO
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # CAPTURE ENVIRONMENT SELECTION
      # -----------------------------
      - name: Set selected ENV
        run: echo "TF_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Debug selected environment
        run: echo "Deploying environment: $TF_ENV"

      # -----------------------------
      # AWS AUTH VIA OIDC
      # -----------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::108471662249:role/GhaDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # INSTALL TERRAFORM
      # -----------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      # -----------------------------
      # TERRAFORM INIT (USE CORRECT BACKEND)
      # -----------------------------
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="backend/${TF_ENV}.tfbackend"

      # -----------------------------
      # VALIDATE
      # -----------------------------
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # ----------------
