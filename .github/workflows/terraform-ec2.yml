name: Terraform EC2 Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set selected environment
        run: echo "TF_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Debug selected environment
        run: |
          echo "Deploying environment: $TF_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::108471662249:role/GhaDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init -input=false -backend-config="backend/${TF_ENV}.tfbackend"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=envs/${TF_ENV}.tfvars -out=tfplan

      # Manual Approval BEFORE PROD apply
      - name: Manual Approval Before Prod Deploy
      - if: ${{ env.TF_ENV == 'prod' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: group2cet11
          minimum-approvals: 1
          issue-title: "Approve PROD Deployment"

      # Apply for dev/uat
      - name: Terraform Apply (non-prod)
        if: ${{ env.TF_ENV != 'prod' }}
        run: terraform apply -auto-approve tfplan

      # Apply after approval for prod
      - name: Terraform Apply (prod)
        if: ${{ env.TF_ENV == 'prod' }}
        run: terraform apply -auto-approve tfplan

      # Output for dev/uat
      - name: Output EC2 Public IP
        if: ${{ env.TF_ENV != 'prod' }}
        run: |
          IP=$(terraform output -json | jq -r '.public_ip.value')
          echo "EC2_IP=$IP" >> $GITHUB_ENV
          echo "## 🚀 EC2 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $TF_ENV" >> $GITHUB_STEP_SUMMARY
          echo "**Public IP:** $IP" >> $GITHUB_STEP_SUMMARY
          echo "[Open Website](http://$IP)" >> $GITHUB_STEP_SUMMARY
